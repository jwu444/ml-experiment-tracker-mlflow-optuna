# Two services (§7.1): the SPA is static, the API is a container. A single
# origin would need every backend route prefixed under /api, which changes
# /agent/chat — the path D42 argues for by name.
services:
  - type: web
    name: wavepoint-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # No preDeployCommand: free-tier services do not support one. The MLflow
    # store is prepared at container start instead — see docker-entrypoint.sh.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wavepoint-db
          property: connectionString
      - key: MLFLOW_TRACKING_URI
        fromDatabase:
          name: wavepoint-db
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: MLFLOW_ARTIFACT_ROOT
        sync: false
      - key: MLFLOW_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      # No collector is deployed, and Jaeger stays a local tool (§7.4).
      - key: OTEL_ENABLED
        value: "false"

  # A static site is a web service with a static runtime, not a `static` type —
  # Render's schema has no such type and rejects the whole blueprint on it.
  - type: web
    name: wavepoint-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: wavepoint-db
    plan: free
    postgresMajorVersion: "16"
