# Alembic configuration. The runtime database URL is NOT set here — env.py pulls
# it from app.config.Settings (i.e. the DATABASE_URL env var / .env), so there is
# a single source of truth and no secret is committed to this file.

[alembic]
# Migration scripts live under the backend/ package so `import app` resolves.
script_location = backend/alembic
# Put backend/ on sys.path for `alembic` CLI runs so env.py can `import app`.
prepend_sys_path = backend
# Use a plain filename (no date prefix) — keeps revision files tidy.
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
