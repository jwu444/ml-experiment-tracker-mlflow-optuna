# --- Shape 3: what went wrong ---------------------------------------------

- id: gradient-boosting-worse-than-baseline
  query: which gradient boosting runs did worse than the baseline on revenue nowcast?
  relevant:
    - [note, 5f90c1ac-41b4-430c-a4e6-977c72bc9976] # best of 8, rmse ~12.46e9, still ~3x the baseline
    - [note, 4a54687b-375a-47eb-98aa-ad3b934653af]
    - [note, 6c5ce196-9ef2-4a55-9d89-c03cf5ae679c]
    - [note, bc98addf-c0b4-42ac-94de-e415a89c51bd] # worst of 8
  notes: All four approved gradient_boosting notes have holdout rmse well above the persistence baseline's ~4.06e9.

- id: ridge-alpha-outlier-revenue
  query: why did the high-alpha ridge run on revenue nowcast perform so much worse than the others?
  relevant:
    - [note, 4460e59f-a08a-4b1f-ba7c-221510bfe6ba] # alpha 66.836, worst of 8, rmse ~9.28e9 — over 2x the next-worst ridge run
    - [note, 37ec47a2-3dc5-4942-a82d-7599e11868d6] # best of 8, alpha 0.00249, for contrast
    - [note, 766c6785-a5f1-43a2-b041-a805f23dbea6] # mid of 8, alpha 1.7285, for contrast
  notes: The worst ridge run's alpha is roughly 40x the next-highest approved ridge alpha, and its rmse is the only ridge result worse than the baseline by more than 2x.

- id: random-forest-worst-run-settings
  query: which random forest run on revenue nowcast had the highest error, and how does its depth and leaf setting differ from the best one?
  relevant:
    - [note, e1d835ba-3d2a-4320-bcfd-b5408f8dc815] # worst of 8, depth 6, min_samples_leaf 2
    - [note, df3293ff-7862-402d-b96e-f842538d90b2] # best of 8, depth 12, min_samples_leaf 9
  notes: The worst run uses a shallower tree (depth 6 vs 12) and a smaller leaf size (2 vs 9) than the best run.

- id: runs-with-diagnostic-writeups
  query: which runs have diagnostic write-ups explaining their residual behavior?
  relevant:
    - [diagnostic, 37ec47a2-3dc5-4942-a82d-7599e11868d6]
    - [diagnostic, 5cba07a9-2e22-41eb-af13-d222ce956e3b]
    - [diagnostic, 9aee247b-a63d-4a42-8434-f54e71f009a0]
  notes: Exactly three app.findings rows have source_type=diagnostic in the current index.

- id: pc-video-card-worst-run-diagnosis
  query: is there a diagnostic write-up explaining why the worst PC part video-card ridge run underperformed?
  relevant:
    - [diagnostic, 9aee247b-a63d-4a42-8434-f54e71f009a0] # the only diagnostic finding in this experiment (on the MID run, not the worst)
    - [note, 2e6ca0df-8077-41a3-a412-7386acd134a4] # the worst run itself, which has no diagnostic finding of its own
  notes: >
    A correct answer should say no diagnostic exists for the worst run
    (2e6ca0df) and point instead to the only diagnostic finding in the
    experiment, which is on the mid run (9aee247b).

