# Phase 4 golden set (D43/D44). Authored blind: from GET /experiments, GET
# /experiments (metadata only), psql over app.runs/app.experiments/app.datasets
# (explicit metadata columns only) and mlflow.params/mlflow.latest_metrics —
# never from note or finding prose. See backend/eval/README-authoring notes in
# the task-6 report for the full provenance.
#
# Shape 1 (which model won), shape 2 (parameter ranges), shape 3 (what went
# wrong), shape 4 (dataset/EDA questions) — five queries each.

# --- Shape 1: which model won -------------------------------------------

- id: which-model-won-revenue
  query: which model performed best on the revenue nowcast?
  relevant:
    - [note, 5cba07a9-2e22-41eb-af13-d222ce956e3b] # persistence, best of 2, holdout rmse ~4.064e9
    - [note, 37ec47a2-3dc5-4942-a82d-7599e11868d6] # ridge, best of 8, holdout rmse ~4.116e9 (near-tied)
    - [diagnostic, 5cba07a9-2e22-41eb-af13-d222ce956e3b]
    - [diagnostic, 37ec47a2-3dc5-4942-a82d-7599e11868d6]
  notes: >
    Persistence and ridge are statistically near-tied for best holdout rmse on
    revenue-nowcast (~4.06e9 vs ~4.12e9), both far ahead of random_forest and
    gradient_boosting's best runs (~12e9+). Labelled from mlflow.latest_metrics.

- id: which-ridge-run-won-pc-video-card
  query: which ridge run performed best on the PC part video-card price experiment?
  relevant:
    - [note, ce300a47-363c-4afe-9021-679cc8063c30] # best of 8, rmse 382.95
    - [note, 9aee247b-a63d-4a42-8434-f54e71f009a0] # mid of 8, rmse 382.995 (near-identical)
  notes: >
    ce300a47 and 9aee247b are separated by 0.045 rmse — effectively tied for
    best; a correct answer should surface both, not just the nominal winner.

- id: gradient-boosting-vs-random-forest-revenue
  query: between gradient boosting and random forest, which had the lower error on revenue nowcast?
  relevant:
    - [note, df3293ff-7862-402d-b96e-f842538d90b2] # random_forest best of 8, rmse ~12.06e9
    - [note, 5f90c1ac-41b4-430c-a4e6-977c72bc9976] # gradient_boosting best of 8, rmse ~12.46e9
  notes: random_forest's best run edges out gradient_boosting's best by holdout rmse.

- id: worst-model-family-revenue
  query: which model type had the worst results on the revenue nowcast panel?
  relevant:
    - [note, bc98addf-c0b4-42ac-94de-e415a89c51bd] # gradient_boosting worst of 8, rmse ~16.15e9, highest of all approved runs
    - [note, 5f90c1ac-41b4-430c-a4e6-977c72bc9976] # gradient_boosting best of 8, still worse than random_forest's best
    - [note, df3293ff-7862-402d-b96e-f842538d90b2] # random_forest best of 8, for contrast
  notes: >
    Every approved gradient_boosting run (best included) has a higher holdout
    rmse than random_forest's best run, making gradient_boosting the
    consistently worst family on this dataset.

- id: baseline-vs-random-forest-revenue
  query: how does the persistence baseline compare to random forest on revenue nowcast — did the simple baseline actually win?
  relevant:
    - [note, 5cba07a9-2e22-41eb-af13-d222ce956e3b] # persistence best, rmse ~4.06e9
    - [note, df3293ff-7862-402d-b96e-f842538d90b2] # random_forest best, rmse ~12.06e9
    - [diagnostic, 5cba07a9-2e22-41eb-af13-d222ce956e3b]
  notes: Persistence's holdout rmse is roughly a third of random_forest's best.

